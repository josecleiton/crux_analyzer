# The guard that makes the documentation defensible: `just check` on every
# change, plus the two things `check` cannot know about — that the committed
# generated examples are current, and that the fixture extracts without a
# single warning.
#
# The Quipu corpus test is gated on QUIPU_SRC and that source is not public, so
# it skips itself here by design (see docs/development.md). CI therefore proves
# the fixture path; the corpus stays a local gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: `check` runs build and test code from the branch,
# so it gets a read-only token. The one job that needs more (`preview`) asks for
# it itself. Without this block both jobs inherit the repository default, which
# on older repositories is read/write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable —
# `dtolnay/rust-toolchain@stable` is a *branch* — so whoever controls the action
# repository could change what runs here after review. The trailing comment is
# the ref each SHA was resolved from; bump both together.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rust tests + clippy + web tests + web build + the fixture guard (tsc is
      # the i18n catalog parity check).
      - run: just check

      # The generated examples are committed, so they can drift. Regenerating
      # must be a no-op.
      - name: Generated examples are current
        run: just docs-current

  # A living preview of the tool on GitHub Pages: the bundled fixture
  # analyzed by the freshly built analyzer and published as a static site —
  # the same `just site` recipe users run, pointed at the public corpus.
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First run enables Pages on the repo (build_type: workflow).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Project Pages serve from /<repo>/, so the base must match.
      #
      # The repository name goes through the environment rather than being
      # interpolated into the script. GitHub restricts repository names to
      # `[A-Za-z0-9._-]`, so `${{ }}` here is not exploitable today — but
      # expression-into-`run:` is the shape that becomes an injection the moment
      # the value is something a stranger can set, and it should not be the
      # pattern this repository models.
      - name: Build the mini-recorder site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: just site crates/parser/fixtures/mini_recorder "Mini Recorder" "/$REPO_NAME/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v5
