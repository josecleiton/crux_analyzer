# The guard that makes the documentation defensible: `just check` on every
# change, plus the two things `check` cannot know about — that the committed
# generated examples are current, and that the fixture extracts without a
# single warning.
#
# A test against a private target app never reaches this repository — those
# live as untracked `crates/parser/tests/*_hidden.rs` files, gated on APP_SRC
# (see docs/development.md). CI therefore proves the fixture path; a real app
# stays a local gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: `check` runs build and test code from the branch,
# so it gets a read-only token. The one job that needs more (`preview`) asks for
# it itself. Without this block both jobs inherit the repository default, which
# on older repositories is read/write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable —
# `dtolnay/rust-toolchain@stable` is a *branch* — so whoever controls the action
# repository could change what runs here after review. The trailing comment is
# the ref each SHA was resolved from; bump both together.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rust tests + clippy + web tests + web build + the fixture guard (tsc is
      # the i18n catalog parity check), plus the supply-chain and third-party
      # license gates.
      - run: just check

      # The generated examples are committed, so they can drift. Regenerating
      # must be a no-op.
      - name: Generated examples are current
        run: just docs-current

  # A living preview of the tool on GitHub Pages: the bundled fixture
  # analyzed by the freshly built analyzer and published as a static site —
  # the same `just site` recipe users run, pointed at the public fixture.
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pages must already be enabled on the repository, with its source set to
      # GitHub Actions. `enablement: true` cannot do it: creating a Pages site
      # is an *administration* write, and `administration` is not one of the
      # scopes a workflow can request — so the step failed with "Resource not
      # accessible by integration" no matter what `permissions:` said. It is a
      # one-time repository setting, done out of band:
      #
      #   gh api -X POST repos/OWNER/REPO/pages -f 'build_type=workflow'
      #   # or: Settings → Pages → Source: GitHub Actions
      #
      # With the site created, `pages: write` below is enough to deploy to it.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Project Pages serve from /<repo>/, so the base must match.
      #
      # The repository name goes through the environment rather than being
      # interpolated into the script. GitHub restricts repository names to
      # `[A-Za-z0-9._-]`, so `${{ }}` here is not exploitable today — but
      # expression-into-`run:` is the shape that becomes an injection the moment
      # the value is something a stranger can set, and it should not be the
      # pattern this repository models.
      - name: Build the mini-recorder site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: just site crates/parser/fixtures/mini_recorder "Mini Recorder" "/$REPO_NAME/" apps/web/dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
