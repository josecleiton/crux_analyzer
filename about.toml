# Third-party notices for the `crux-analyzer` binary, generated by
# `cargo about generate` (run via `just notices`).
#
# The web bundle has its own generator (`apps/web/notices.ts`) because it must
# list what the bundler actually emitted. This side is simpler: everything the
# binary links is a notice obligation.
#
# `accepted` must stay in step with `deny.toml`'s `licenses.allow` — cargo-deny
# decides what may enter the tree, this decides what gets reproduced, and a
# license in one but not the other means one of them is wrong.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]

# Only the targets this project actually builds and ships. Without this,
# cargo-about walks the Windows and wasm trees of `notify`'s platform backends
# and demands licenses for crates that never link into any artifact we produce.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build-time-only crates are not distributed, so they carry no notice
# obligation — the same reasoning that keeps dev dependencies out of the web
# notices.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# A crate whose license cannot be determined fails the run rather than being
# quietly omitted: a notices file that looks complete and is not is worse than
# none at all. That is cargo-about's default — there is no `ignore` list here,
# and adding one should be a deliberate, commented decision.
