[package]
name = "crux-analyzer-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static parser for Rust + Crux code: emits the intermediate model."

[dependencies]
crux-analyzer-i18n = { path = "../i18n", version = "0.1.0" }
crux-analyzer-model = { path = "../model", version = "0.1.0" }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
walkdir = "2"
